<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLarge Studios</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: #111116;
            border-bottom: 1px solid #25252d;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 30px;
            font-size: 15px;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background:
                radial-gradient(circle at center, #25254a 0%, #0b0b0f 55%);
        }

        .hero h1 {
            font-size: clamp(50px, 9vw, 110px);
            font-weight: 900;
            letter-spacing: -4px;
        }

        .hero p {
            margin-top: 20px;
            color: #aaa;
            font-size: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 35px;
            padding: 15px 28px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #4752c4;
        }

        section {
            padding: 80px 7%;
        }

        .section-title {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: #15151c;
            border: 1px solid #262630;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #5865f2;
        }

        .game-image {
            height: 180px;
            background: linear-gradient(135deg, #5865f2, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        .game-info {
            padding: 20px;
        }

        .game-info p {
            color: #999;
            margin-top: 8px;
        }

        footer {
            padding: 30px 7%;
            text-align: center;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">XLARGE STUDIOS</div>

    <nav>
        <a href="#">Games</a>
        <a href="#">About</a>
        <a href="#">Updates</a>
        <a href="#">Community</a>
    </nav>
</header>

<section class="hero">
    <div>
        <h1>XLARGE</h1>
        <p>Think Bigger. Play Beyond.</p>

        <a href="#games" class="button">Explore Games</a>
    </div>
</section>

<section id="games">
    <h2 class="section-title">Our Games</h2>

    <div class="games">

        <div class="game-card">
            <div class="game-image">
                COMING SOON
            </div>

            <div class="game-info">
                <h3>Our First Game</h3>
                <p>Something big is coming.</p>
            </div>
        </div>

    </div>
</section>

<footer>
    © 2026 XLarge Studios — Think Bigger. Play Beyond.
</footer>

</body>
</html>
